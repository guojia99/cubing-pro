# 本地开发示例，不是生产配置。先运行 make init-config，再修改私人副本。
# 所有相对文件路径以进程工作目录为基准，不以本 YAML 所在目录为基准。
# 不支持 ${VAR} 环境变量插值。功能依赖与迁移说明见 docs/configuration.md。
log:
  path: "./logs"
  maxSize: 100 # MB，日志文件名为 cubing-pro.log

global:
  baseHost: "http://127.0.0.1:8080"
  debug: true
  db:
    driver: "sqlite"
    dsn: "./cubingPro.db"
  scramble:
    type: "tnoodle" # 空值也默认为 tnoodle；须另行准备兼容的打乱服务
    endpoint: "http://127.0.0.1:20009"
    scrambleDrawType: "2mf8" # 绘图仍依赖代码内的外部服务
  emailConfig:
    smtpHost: ""
    smtpPort: 0
    from: ""
    fromName: cubingPro
    password: ""
  # 实际键名为 wcaDB。空值不提供 WCA 数据；不要为本地示例加 -w。
  # 即使不加 -w，仍有本地指针读取循环和独立的 Seniors 初始化，详见文档。
  wcaDB:
    mysqlUrl: ""
    dbPath: ""
    syncPath: ""
  algTrainersPath: "" # 选配；启用时还要求同级 Algs/catalog.json 等公式库
  wcaAuth2:
    appId: "" # 未配置凭据时 WCA 登录不可用
    appSecret: ""
    redirectBase: "http://127.0.0.1:8080"
    frontendBase: "http://127.0.0.1:8080"
    auths: ["public", "dob", "email", "openid", "profile"]

gateway:
  httpPort: 8080 # 非特权端口；实现监听所有网卡，本地使用仍需控制网络访问
  httpsPort: 0 # 显式关闭 TLS；启用需正数端口及非空证书、私钥
  pem: ""
  privateKey: ""
  httpsHost: ""
  xFile: "./local/x-file"
  # 前端静态导出产物示例位置，须自行构建并放入，不由后端生成或复制。
  staticRoot: "./local/frontend/out"
  spa: false
  dynamicRouteFallbacks:
    - match: "^/competition/[^/]+/?$"
      placeholder: "/competition/__dynamic__/index.html"
    - match: "^/player/[^/]+/?$"
      placeholder: "/player/__dynamic__/index.html"
    - match: "^/wca/player/[^/]+/?$"
      placeholder: "/wca/player/__dynamic__/index.html"
    - match: "^/admin/organizers/[^/]+/comp/[^/]+/result/?$"
      placeholder: "/admin/organizers/__dynamic__/comp/__dynamic__/result/index.html"
  tNoodlePort: 20009 # 仅供额外 tNoodle 代理使用，与 global.scramble.endpoint 独立
  outsizeTNoodlePort: 0 # 不开启额外监听

api:
  host: "localhost"
  port: 20000
  staticPath: "./local/static" # avatar/、advertisements/ 上传资源根目录

job:
  unRunJobs: [] # 仅过滤已注册的任务；不加 -j 时不启动这些任务循环

robot:
  CQHttpBot:
    - enable: false
      prefix: ""
      address: ""
      post: 0
  QQBot:
    - enable: false # 唯一的 QQ 实例启用开关；以下为空/零占位，不能直接启用
      qq: 0
      app_id: 0
      token: ""
      app_secret: ""
      is_sandbox: false
      wss_addr: ""
      is_open: false
      server:
        port: 0
        certFile: ""
        certKey: ""
        isOpen: false
  WeChatBot:
    - enable: false # 当前没有接入启动流程
